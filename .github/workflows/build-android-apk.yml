name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android wrapper
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare clean APK filename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rajaswa_Nyayalaya_Case_Diary.apk

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rajaswa-nyayalaya-case-diary-apk
          path: Rajaswa_Nyayalaya_Case_Diary.apk
          retention-days: 90

      - name: Publish Direct Download APK on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Rajaswa_Nyayalaya_Case_Diary.apk \
            --title "राजस्व न्यायालय केस डायरी ($TAG) — UMESH VERMA ADVOCATE" \
            --notes "Direct Android APK डाउनलोड करने के लिए नीचे Rajaswa_Nyayalaya_Case_Diary.apk पर क्लिक करें।" \
            --latest
